<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BNPL Credit Risk Dashboard</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header id="header">
    <div id="header-left">
      <div id="header-title-row">
        <span class="header-title">BNPL Credit Risk Dashboard</span>
        <span id="record-count"></span>
      </div>
      <span class="header-subtitle">Start with the stream graph, then explore the heatmap and sankey, and finish with the scatter plot for detailed insight.</span>
    </div>
    <div id="header-right">
      <div id="filter-group">
        <select id="select-risk" class="dem-filter">
          <option value="All">All risks</option>
          <option value="High Risk">High risk</option>
          <option value="Medium Risk">Medium risk</option>
          <option value="Low Risk">Low risk</option>
        </select>
      </div>
      <div id="demographic-filters">
        <select id="select-age" class="dem-filter">
          <option value="All">All ages</option>
        </select>
        <select id="select-employment" class="dem-filter">
          <option value="All">All employment</option>
        </select>
        <select id="select-location" class="dem-filter">
          <option value="All">All locations</option>
        </select>
        <select id="select-product" class="dem-filter">
          <option value="All">All categories</option>
        </select>
        <button id="reset-filters" class="filter-pill">Reset</button>
      </div>
    </div>
  </header>

  <main id="dashboard">
    <div id="top-row">
      <div class="chart-card" id="card-stream">
        <svg id="svg-stream"></svg>
      </div>
      <div class="chart-card" id="card-heatmap">
        <svg id="svg-heatmap"></svg>
      </div>
      <div class="chart-card" id="card-sankey">
        <svg id="svg-sankey"></svg>
      </div>
    </div>

    <div id="bottom-row">
      <div class="chart-card" id="card-scatter">
        <svg id="svg-scatter"></svg>
      </div>
    </div>
  </main>

  <div class="dashboard-tooltip" id="tooltip"></div>

  <script src="https://d3js.org/d3.v7.min.js"></script>
  <script src="https://unpkg.com/d3-sankey@0.12.3/dist/d3-sankey.min.js"></script>
  <script src="heatmap.js?v=12"></script>
  <script src="scatterplot.js?v=12"></script>
  <script src="sankey.js?v=12"></script>
  <script src="stream.js?v=12"></script>
  <script src="main.js?v=12"></script>
</body>
</html>
